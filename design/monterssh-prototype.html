*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e8edf3;color:#243347}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ab6ff;outline-offset:3px}.scene{padding:36px 24px 28px;background:radial-gradient(ellipse at 90% 10%,#c4d4ec 0,transparent 50%),radial-gradient(ellipse at 0 90%,#beced4 0,transparent 50%),linear-gradient(130deg,#e4e9ef,#e6dcd6);min-height:850px}.caption{max-width:1200px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between;color:#596c80;font-size:12px;letter-spacing:.04em}.window{max-width:1200px;margin:auto;border:1px solid #ffffffd9;border-radius:24px;box-shadow:0 35px 100px #30456030,0 2px 6px #2b3f5210;display:grid;grid-template-columns:215px 1fr;overflow:hidden;background:#f8fafbe8;min-height:710px;backdrop-filter:blur(35px)}aside{background:linear-gradient(140deg,#ffffff83,#e4edf29c);border-right:1px solid #ffffff;padding:22px 14px;display:flex;flex-direction:column}.lights{display:flex;gap:8px;margin:0 10px 30px}.lights i{width:12px;height:12px;border-radius:50%;background:#ff6058;box-shadow:inset 0 0 0 1px #0001}.lights i:nth-child(2){background:#ffbd2e}.lights i:nth-child(3){background:#28c840}.brand{font-size:20px;letter-spacing:-.8px;font-weight:750;margin:0 12px 30px;display:flex;align-items:center;gap:10px}.logo{background:#344b6a;color:white;border-radius:11px;padding:7px;font-size:17px}.nav,.group{width:100%;display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;text-align:left;background:transparent;color:#526477;margin:3px 0}.nav.active{background:#ffffffb3;color:#24466c;box-shadow:0 3px 10px #324d6e0b,inset 0 0 0 1px #fff}.nav b{margin-left:auto;font-size:11px;background:#e4ecf5;border-radius:6px;padding:2px 6px}.section-label{font-size:10px;color:#8694a2;letter-spacing:1.3px;font-weight:700;margin:30px 13px 9px}.group{font-size:12px;padding:9px 13px}.dot{height:7px;width:7px;border-radius:50%;background:#8294e2}.group:nth-of-type(even) .dot{background:#d3aa75}.aside-bottom{margin-top:auto;padding:20px 12px 0;font-size:11px;color:#82909d;line-height:1.8}.health{color:#4c806e}.main{padding:0 30px 24px;min-width:0}header{height:65px;display:flex;align-items:center;justify-content:space-between;color:#8b98a8;border-bottom:1px solid #e1e7ed;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center}.iconbtn{background:#fff9;border:1px solid #dce4ec;border-radius:8px;padding:6px 9px;color:#697c90}h1{font-size:27px;letter-spacing:-.8px;margin:0;font-weight:650}h2{font-size:16px;font-weight:650;letter-spacing:-.2px}p{color:#8190a0;line-height:1.6}.heading{display:flex;align-items:center;justify-content:space-between;padding:28px 0 22px;gap:12px}.heading p{margin:7px 0 0;font-size:12px}.primary{background:linear-gradient(#6886af,#4f709d);color:#fff;padding:10px 15px;border:1px solid #6481a6;border-radius:10px;box-shadow:0 3px 6px #526e9c20;white-space:nowrap}.secondary{background:#fff9;border:1px solid #dae2eb;color:#62758b;border-radius:9px;padding:9px 12px}.danger{color:#b76a68}.summary{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin-bottom:23px}.stat{padding:17px 18px;background:linear-gradient(140deg,#fff,#f3f7fa);border:1px solid #e1e8f0;border-radius:14px;box-shadow:0 3px 8px #314d6a03}.stat-label{font-size:11px;color:#8291a2}.stat-value{margin-top:9px;font-size:25px;color:#354d69;letter-spacing:-.7px}.stat-value small{font-size:11px;letter-spacing:0;color:#8e9cac;margin-left:7px}.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#68ab93;margin-right:7px}.tools{display:flex;gap:10px;justify-content:space-between;margin-bottom:16px}.search{background:white;border:1px solid #e0e6ed;border-radius:9px;padding:9px 12px;display:flex;gap:8px;align-items:center;flex:1;max-width:340px;color:#94a2b2}.search input{border:0;outline:none;width:100%;background:transparent;font-size:12px;color:#344b65}.tabs{display:flex;background:#e9eef4;padding:3px;border-radius:9px;gap:3px}.tabs button{font-size:11px;background:transparent;color:#8191a4;padding:7px 12px;border-radius:7px}.tabs .selected{background:white;box-shadow:0 1px 4px #344c6a14;color:#4e6684}.list-title{display:flex;justify-content:space-between;color:#91a0b0;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:0 13px 10px}.project{border:1px solid #e1e7ef;border-radius:12px;background:#fff;margin-bottom:8px;display:grid;grid-template-columns:38px 1fr 105px 122px 32px;gap:12px;align-items:center;padding:14px}.project:hover{box-shadow:0 4px 15px #2f4d7410;border-color:#cbd8e8}.avatar{width:36px;height:36px;border-radius:10px;background:#eaf0f8;color:#7793b7;display:grid;place-items:center;font-size:15px}.project-name{font-size:13px;font-weight:600}.meta{font-size:10px;color:#95a2b2;margin-top:5px}.badge{font-size:10px;color:#8f9ca9;white-space:nowrap}.badge.online{color:#5a917e}.connect{background:#f2f6fb;color:#6383a9;border:1px solid #d9e4f0;border-radius:8px;padding:7px;font-size:11px}.connect.online{background:#fff;color:#8593a3;border-color:#e1e6ed}.more{background:transparent;color:#93a0af;font-size:19px}.bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid #e1e7ed;font-size:10px;color:#94a1b0}.footnote{max-width:1200px;margin:18px auto 0;color:#708295;font-size:11px;display:flex;justify-content:space-between}.panel{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:21px;margin-bottom:14px}.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #edf1f5}.setting:last-child{border:0}.setting p{font-size:11px;margin:5px 0}.switch{width:36px;height:21px;border-radius:20px;background:#cfd9e5;padding:3px;flex-shrink:0}.switch:after{content:'';display:block;background:white;width:15px;height:15px;border-radius:50%;box-shadow:0 1px 4px #0002}.switch.on{background:#6e91bb}.switch.on:after{margin-left:auto}.empty{text-align:center;padding:50px;color:#8999aa}.event{display:flex;gap:14px;border-bottom:1px solid #eef2f6;padding:17px 0;font-size:12px}.event time{color:#97a5b3;font-size:10px;min-width:55px}.event p{margin:5px 0 0;font-size:11px}.modal-backdrop{position:fixed;inset:0;background:#27394e38;backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:470px;max-height:90%;overflow:auto;border:1px solid white;background:#f8fafbf5;border-radius:20px;box-shadow:0 30px 100px #16354e35;padding:25px}.modal h2{font-size:21px;margin:0 0 5px}.modal p{font-size:12px}.field{display:block;font-size:11px;color:#718399;margin:15px 0}.field input,.field select{display:block;width:100%;margin-top:7px;padding:10px 12px;border:1px solid #dbe3ed;border-radius:9px;background:white;color:#344960}.form-row{display:grid;grid-template-columns:1fr 90px;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:25px}.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#344a62ef;color:white;border-radius:12px;padding:13px 22px;font-size:12px;z-index:40;box-shadow:0 10px 35px #20375125}.hidden{display:none!important}a{color:#6085af}body.dark .window{filter:invert(.85) hue-rotate(175deg)}@media(max-width:850px){.window{grid-template-columns:170px 1fr}.main{padding:0 18px 20px}.summary{gap:7px}.stat{padding:14px 12px}.project{grid-template-columns:30px 1fr 100px;gap:8px}.project .badge,.more{display:none}.tools{flex-wrap:wrap}.scene{padding:15px}.heading{align-items:flex-start}h1{font-size:23px}}@media(max-width:600px){.window{display:block}aside{display:none}.summary{grid-template-columns:1fr 1fr}.stat:last-child{display:none}.heading{flex-direction:column}.caption span:last-child{display:none}}

<body><div class="scene"><div class="caption"><span>MONTERSSH / DESIGN PREVIEW 01</span><span>macOS · Liquid glass concept</span></div><div class="window"><aside><div class="lights"><i></i><i></i><i></i></div><div class="brand"><span class="logo">⌘</span>monterssh</div><nav><button class="nav active" data-page="projects">▦ <span>Проекты</span><b id="navCount">6</b></button><button class="nav" data-page="active">◉ <span>Подключения</span><b id="activeCount">2</b></button><button class="nav" data-page="activity">↗ <span>Журнал событий</span></button><button class="nav" data-page="settings">⚙ <span>Настройки</span></button></nav><div class="section-label">РАБОЧИЕ ПРОСТРАНСТВА</div><button class="group" data-group="Работа"><span class="dot"></span>Работа</button><button class="group" data-group="Личное"><span class="dot"></span>Личное</button><button class="group" data-group="Архив"><span class="dot"></span>Архив</button><div class="aside-bottom"><span class="health">● Все системы готовы</span><br>SSHFS + macFUSE<br>Monterssh 0.1 · Прототип</div></aside><main class="main"><header><span id="breadcrumb">Рабочее пространство / Проекты</span><div class="toolbar"><span>⌘ K</span><button class="iconbtn" id="refresh" title="Обновить статусы">↻</button><button class="iconbtn" id="theme" title="Переключить тему">◐</button></div></header><div id="content"></div></main></div><div class="footnote"><span>Интерактивный прототип · Все подключения и события демонстрационные</span><span>Designed for a quieter workflow.</span></div></div><div id="overlay" class="hidden"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const projects=[{id:1,name:'Northstar Studio',host:'deploy@northstar.example',path:'/var/www/studio',mount:'northstar-studio',group:'Работа',on:true,fav:true,letter:'N'},{id:2,name:'Forma / Production',host:'forma@hosting.example',path:'/home/forma/www',mount:'forma-production',group:'Работа',on:true,fav:true,letter:'F'},{id:3,name:'Personal website',host:'alex@personal.example',path:'/var/www/personal',mount:'personal-website',group:'Личное',on:false,fav:false,letter:'P'},{id:4,name:'Atlas Commerce',host:'atlas@hosting.example',path:'/home/atlas/shop',mount:'atlas-commerce',group:'Работа',on:false,fav:true,letter:'A'},{id:5,name:'Sandbox',host:'dev@sandbox.example',path:'/home/dev',mount:'sandbox',group:'Личное',on:false,fav:false,letter:'S'},{id:6,name:'Legacy archive',host:'backup@archive.example',path:'/backup',mount:'legacy',group:'Архив',on:false,fav:false,letter:'L'}];
let page='projects',filter='all',group='',query='';const events=[{time:'Сейчас',title:'Рабочее пространство готово',detail:'Загружено 6 проектов. Два подключения активны.'},{time:'09:42',title:'Forma / Production подключён',detail:'/Volumes/forma-production · SSH-ключ id_ed25519'},{time:'09:41',title:'Northstar Studio подключён',detail:'/Volumes/northstar-studio · Автопереподключение включено'}];const $=s=>document.querySelector(s);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').classList.add('hidden'),2800)}function log(title,detail=''){events.unshift({time:new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}),title,detail})}function go(p){page=p;group='';query='';render()}function heading(title,desc,action=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}function render(){const n=projects.filter(p=>p.on).length;$('#activeCount').textContent=n;$('#navCount').textContent=projects.length;document.querySelectorAll('.nav').forEach(el=>el.classList.toggle('active',el.dataset.page===page));const labels={projects:'Проекты',active:'Подключения',activity:'Журнал событий',settings:'Настройки'};$('#breadcrumb').textContent='Рабочее пространство / '+labels[page];let html='';if(page==='projects'||page==='active'){html=heading(group||labels[page],page==='active'?'Все смонтированные проекты в одном месте.':'Ваши удалённые проекты. Всегда под рукой.',`<button class="primary" onclick="openForm()">＋ Добавить проект</button>`)+`<div class="summary"><div class="stat"><div class="stat-label"><span class="live"></span>Активные подключения</div><div class="stat-value">${n.toString().padStart(2,'0')}<small>из ${projects.length} проектов</small></div></div><div class="stat"><div class="stat-label">Переподключение</div><div class="stat-value" style="font-size:17px;margin-top:14px">Автоматически <small>✓</small></div></div><div class="stat"><div class="stat-label">Состояние сервиса</div><div class="stat-value" style="font-size:17px;margin-top:14px">Всё готово <small>macFUSE</small></div></div></div><div class="tools"><label class="search">⌕ <input id="search" placeholder="Найти проект или сервер…" value="${esc(query)}" aria-label="Поиск проектов"></label><div class="tabs"><button class="${filter==='all'?'selected':''}" onclick="setFilter('all')">Все</button><button class="${filter==='fav'?'selected':''}" onclick="setFilter('fav')">Избранные</button><button class="${filter==='on'?'selected':''}" onclick="setFilter('on')">Активные</button></div></div><div class="list-title"><span>ПРОЕКТ / СЕРВЕР</span><span>ПОДКЛЮЧЕНИЕ</span></div><div id="rows"></div><div class="bottom-bar"><span>⌘ K — поиск проекта · Данные хранятся на Mac</span><button class="secondary danger" onclick="disconnectAll()">Отключить все</button></div>`}else if(page==='activity'){html=heading('Журнал событий','История подключений и понятные сообщения об ошибках.',`<button class="secondary" onclick="toast('Демонстрационный журнал экспортирован')">Экспорт</button>`)+`<div class="panel">${events.map(e=>`<div class="event"><time>${esc(e.time)}</time><span style="color:#75a28f">●</span><div>${esc(e.title)}<p>${esc(e.detail)}</p></div></div>`).join('')}</div>`}else{html=heading('Настройки','Удобное поведение приложения, без лишних действий.')+`<div class="panel"><h2>Подключения</h2>${setting('Автоматическое переподключение','Восстанавливать SSHFS-соединение после потери сети.',true)}${setting('Подключать избранные при запуске','Подключения запускаются последовательно, без перегрузки.',false)}${setting('Открывать папку после подключения','Показывать удалённый проект в Finder.',true)}<div class="setting"><div>Папка монтирования<p>Единое расположение всех подключений</p></div><code>/Volumes</code></div></div><div class="panel"><h2>Приложение</h2>${setting('Запускать при входе в macOS','Monterssh будет доступен в строке меню.',false)}${setting('Уведомления об ошибках','Сообщать, если подключение требует внимания.',true)}<div class="setting"><div>Конфигурация проектов<p>Импорт существующего data.json и резервная копия.</p></div><button class="secondary" onclick="toast('В приложении здесь будет импорт data.json')">Импортировать</button></div></div><div class="panel"><h2>Диагностика</h2><p style="font-size:12px">● PHP / SSHFS / macFUSE доступны · SSH Agent готов</p><button class="secondary" onclick="toast('Проверка завершена: всё готово к работе')">Проверить окружение</button></div>`}$('#content').innerHTML=html;if($('#rows')){rows();$('#search').oninput=e=>{query=e.target.value;rows()}}}function setting(title,desc,on){return `<div class="setting"><div>${title}<p>${desc}</p></div><button class="switch ${on?'on':''}" aria-label="${title}" aria-pressed="${on}" onclick="this.classList.toggle('on');this.setAttribute('aria-pressed',this.classList.contains('on'));toast('Настройка изменена в прототипе')"></button></div>`}function setFilter(f){filter=f;render()}function rows(){let list=projects.filter(p=>(page!=='active'||p.on)&&(!group||p.group===group)&&(filter!=='fav'||p.fav)&&(filter!=='on'||p.on)&&(p.name+' '+p.host).toLowerCase().includes(query.toLowerCase()));$('#rows').innerHTML=list.length?list.map(p=>`<div class="project"><div class="avatar">${esc(p.letter)}</div><div><div class="project-name">${esc(p.name)} ${p.fav?'<span style="color:#c4ab7c;font-size:11px">★</span>':''}</div><div class="meta">${esc(p.host)} · ${esc(p.group)}</div></div><span class="badge ${p.on?'online':''}">${p.on?'● Подключён':'○ Отключён'}</span><button class="connect ${p.on?'online':''}" onclick="toggle(${p.id})">${p.on?'Отключить':'Подключить'}</button><button class="more" title="Детали проекта" onclick="details(${p.id})">⋯</button></div>`).join(''):'<div class="empty">Проектов не найдено<br><p>Измените поиск или фильтр</p></div>'}function toggle(id){const p=projects.find(x=>x.id===id);if(p.on){p.on=false;log(p.name+' отключён');render();toast('Точка монтирования отключена')}else{toast('Подключаем '+p.name+'…');setTimeout(()=>{p.on=true;log(p.name+' подключён','/Volumes/'+p.mount);render();toast('Подключено · /Volumes/'+p.mount)},650)}}function modal(s){$('#overlay').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">${s}</div></div>`;$('#overlay').classList.remove('hidden')}function closeModal(){$('#overlay').classList.add('hidden')}function disconnectAll(){const n=projects.filter(p=>p.on).length;if(!n)return toast('Активных подключений нет');modal(`<h2>Отключить ${n} подключения?</h2><p>Открытые файлы могут использоваться другими приложениями. Завершите работу с ними перед отключением.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="projects.forEach(p=>p.on=false);log('Все подключения отключены');closeModal();render();toast('Все точки отключены')">Отключить все</button></div>`)}function details(id){const p=projects.find(x=>x.id===id);modal(`<h2>${esc(p.name)}</h2><p>${esc(p.group)} · ${p.on?'Подключён':'Отключён'}</p><div class="panel"><p>Сервер<br><strong>${esc(p.host)}</strong></p><p>Удалённая папка<br><strong>${esc(p.path)}</strong></p><p>Точка монтирования<br><strong>/Volumes/${esc(p.mount)}</strong></p><p>SSH-ключ<br><strong>id_ed25519 · SSH Agent</strong></p></div><div class="toolbar"><button class="secondary" onclick="toast('В приложении откроется Finder')">Открыть в Finder</button><button class="secondary" onclick="projects.find(x=>x.id===${id}).fav=!projects.find(x=>x.id===${id}).fav;closeModal();render()">${p.fav?'Убрать из избранного':'В избранное'}</button></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Закрыть</button><button class="primary" onclick="openForm(${id})">Изменить</button></div>`)}function openForm(id){const p=projects.find(x=>x.id===id)||{};modal(`<h2>${id?'Изменить':'Новый'} проект</h2><p>Подключите удалённую папку как обычный диск на Mac.</p><form id="projectForm"><label class="field">Название<input name="name" required value="${esc(p.name||'')}" placeholder="Мой проект"></label><div class="form-row"><label class="field">Пользователь и сервер<input name="host" required value="${esc(p.host||'')}" placeholder="user@server.example"></label><label class="field">Порт<input name="port" type="number" min="1" max="65535" value="22" required></label></div><label class="field">Удалённая папка<input name="path" value="${esc(p.path||'')}" placeholder="/var/www/project"></label><label class="field">Название диска в /Volumes<input name="mount" required pattern="[^/]+" value="${esc(p.mount||'')}" placeholder="my-project"></label><div class="form-row" style="grid-template-columns:1fr 1fr"><label class="field">SSH-ключ<select><option>id_ed25519</option><option>id_rsa</option><option>SSH Agent</option></select></label><label class="field">Пространство<select name="group">${['Работа','Личное','Архив'].map(x=>`<option ${p.group===x?'selected':''}>${x}</option>`).join('')}</select></label></div><button type="button" class="secondary" onclick="toast('Тестовое соединение успешно · 42 мс')">Проверить подключение</button><div class="modal-actions"><button type="button" class="secondary" onclick="closeModal()">Отмена</button><button class="primary">Сохранить проект</button></div></form>`);$('#projectForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(id)Object.assign(p,data);else projects.push({...data,id:Date.now(),on:false,fav:false,letter:data.name[0].toUpperCase()});log(id?'Проект обновлён':'Добавлен проект '+data.name);closeModal();render();toast('Проект сохранён в прототипе')}}document.querySelectorAll('.nav').forEach(el=>el.onclick=()=>go(el.dataset.page));document.querySelectorAll('.group').forEach(el=>el.onclick=()=>{page='projects';group=el.dataset.group;filter='all';render()});$('#refresh').onclick=()=>toast('Статусы обновлены');$('#theme').onclick=()=>document.body.classList.toggle('dark');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();go('projects');$('#search').focus()}});render();
</script></body></html>
